	<script>
		// Inbox blog: posts render as email rows; clicking a row expands the
		// post inline, like an opened email in the list.
		const POSTS = [
			{ slug: 'the-art-of-buying-in', title: 'the art of buying in', subject: 'the art of buying in', date: 'Nov 13, 2026', dateFull: 'Fri, Nov 13, 2026', snippet: "When you're playing poker, a lot of the time you're not really playing for the money." },
			{ slug: 'i-believe-god-shuffles', title: 'i believe god shuffles', subject: 'i believe god shuffles [essay post]', date: 'Sep 4, 2026', dateFull: 'Fri, Sep 4, 2026, 8:22 PM', snippet: 'again and again and again and again and', embed: 'substack', mailedBy: 'substack.com', signedBy: 'substack.com' },
			{ slug: 'its_coming', title: "it's coming", subject: "it's coming", date: 'May 18, 2026', dateFull: 'Mon, May 18, 2026', snippet: "On Wednesday May 20th at 7 AM 80,000 employees at Meta will have to roll a ten sided die, and if they roll a one, they'll die." },
			{ slug: 'the-days-are-shorter', title: 'the days are getting shorter', subject: 'the days are getting shorter', date: 'Nov 16, 2025', dateFull: 'Sun, Nov 16, 2025', snippet: 'If I could kidnap all my friends from San Francisco and force them to live in Midtown with me, I would.' },
			{ slug: 'am-i-risking-enough', title: 'running out of validation', subject: 'running out of validation', date: 'Sep 30, 2025', dateFull: 'Tue, Sep 30, 2025', snippet: 'am i risking enough?' },
			{ slug: 'long-time-no-see', title: 'long time no see', subject: 'long time no see', date: 'Jul 31, 2025', dateFull: 'Thu, Jul 31, 2025', snippet: 'nyc month seven: getting back into things' },
		];
		const READ_KEY = 'savan-blog-read-v1';
		let currentTab = 'all';
		let currentSlug = null;

		function getRead() {
			try { return JSON.parse(localStorage.getItem(READ_KEY) || '[]'); } catch (e) { return []; }
		}
		function saveRead(read) {
			try { localStorage.setItem(READ_KEY, JSON.stringify(read)); } catch (e) {}
		}
		function isRead(slug) { return getRead().indexOf(slug) !== -1; }
		function markRead(slug) {
			const read = getRead();
			if (read.indexOf(slug) === -1) { read.push(slug); saveRead(read); }
			updateUnreadCount();
		}
		function updateUnreadCount() {
			const unread = POSTS.filter(function(p) { return !isRead(p.slug); }).length;
			const badge = document.getElementById('unread-count');
			badge.textContent = unread;
			badge.style.display = unread ? '' : 'none';
		}
		function escapeHtml(s) {
			return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
		}
		function rowFor(slug) {
			return document.querySelector('#inbox-list .inbox-row[data-slug="' + slug + '"]');
		}
		function renderRows() {
			const list = document.getElementById('inbox-list');
			list.innerHTML = '';
			POSTS.forEach(function(post) {
				const li = document.createElement('li');
				li.className = 'inbox-row' + (isRead(post.slug) ? ' read' : ' unread');
				li.dataset.slug = post.slug;
				li.innerHTML =
					'<div class="row-summary" onclick="togglePost(\'' + post.slug + '\')">' +
					'<span class="dot"></span>' +
					'<span class="sender">savan doshi</span>' +
					'<span class="subject">' + escapeHtml(post.subject) + '</span>' +
					'<span class="snippet">' + escapeHtml(post.snippet) + '</span>' +
					'<span class="date">' + post.date + '</span>' +
					'</div>' +
					'<div class="row-expanded" style="display:none"></div>';
				list.appendChild(li);
			});
			updateUnreadCount();
			filterRows();
		}
		function setTab(tab) {
			currentTab = tab;
			document.getElementById('tab-all').classList.toggle('active', tab === 'all');
			document.getElementById('tab-unread').classList.toggle('active', tab === 'unread');
			filterRows();
		}
		function filterRows() {
			const q = (document.getElementById('inbox-search').value || '').toLowerCase();
			let visible = 0;
			document.querySelectorAll('#inbox-list .inbox-row').forEach(function(row) {
				const post = POSTS.find(function(p) { return p.slug === row.dataset.slug; });
				const matchesSearch = !q || post.subject.toLowerCase().indexOf(q) !== -1 || post.snippet.toLowerCase().indexOf(q) !== -1 || post.title.toLowerCase().indexOf(q) !== -1;
				const matchesTab = currentTab === 'all' || !isRead(post.slug) || post.slug === currentSlug;
				const show = matchesSearch && matchesTab;
				row.style.display = show ? '' : 'none';
				if (show) visible++;
			});
			document.getElementById('inbox-empty').style.display = visible ? 'none' : 'block';
		}
		function markAllRead() {
			saveRead(POSTS.map(function(p) { return p.slug; }));
			renderRows();
		}
		function markdownToHtml(markdown) {
			const content = markdown
				.replace(/^---\n[\s\S]*?\n---\n/, '')
				.replace(/<!--[\s\S]*?-->/g, '')
				.trim();
			const withBold = content.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
			return '<p>' + withBold.replace(/\n\n+/g, '</p><p>').replace(/\n/g, '<br>') + '</p>';
		}
		function clearExpandedBody() {
			// The Substack embed node lives inside the expanded post while open;
			// move it back to its hidden home before the block is cleared.
			const embed = document.querySelector('.row-expanded .substack-post-embed');
			const home = document.getElementById('substack-embed-source');
			if (embed && home) home.appendChild(embed);
		}
		function expandedHtml(post) {
			const idx = POSTS.findIndex(function(p) { return p.slug === post.slug; });
			return '' +
			'<button class="exp-collapse" onclick="collapsePost()">Click to collapse &larr;</button>' +
			'<h3 class="email-subject">' + escapeHtml(post.title) + '</h3>' +
			'<div class="email-sender">' +
			'<div class="email-avatar">S</div>' +
			'<div class="email-sender-meta">' +
			'<div class="email-sender-line"><strong>savan doshi</strong> <span class="email-address">&lt;savandoshi7@gmail.com&gt;</span></div>' +
			'<div class="email-to-line"><button onclick="toggleDetails(\'' + post.slug + '\')">to me &#9662;</button></div>' +
			'</div>' +
			'<div class="email-date">' + post.dateFull + '</div>' +
			'</div>' +
			'<div id="exp-details-' + post.slug + '" class="email-details" style="display:none">' +
			'<div><span>from:</span> savan doshi &lt;savandoshi7@gmail.com&gt;</div>' +
			'<div><span>to:</span> you</div>' +
			'<div><span>bcc:</span> everyone else</div>' +
			'<div><span>date:</span> ' + post.dateFull + '</div>' +
			'<div><span>subject:</span> ' + escapeHtml(post.subject) + '</div>' +
			'<div><span>mailed-by:</span> ' + (post.mailedBy || 'savan.studio') + '</div>' +
			'<div><span>signed-by:</span> ' + (post.signedBy || 'savandoshi7@gmail.com') + '</div>' +
			'</div>' +
			'<div class="email-body exp-body"></div>' +
			'<div class="email-nav">' +
			'<button onclick="navPost(-1)"' + (idx <= 0 ? ' disabled' : '') + '>&larr; newer</button>' +
			'<button onclick="navPost(1)"' + (idx >= POSTS.length - 1 ? ' disabled' : '') + '>older &rarr;</button>' +
			'</div>' +
			'<div class="email-reply">' +
			'<textarea id="exp-reply-' + post.slug + '" placeholder="respond back&hellip;" rows="3"></textarea>' +
			'<button onclick="sendReply(\'' + post.slug + '\')">Send reply</button>' +
			'</div>';
		}
		function togglePost(slug) {
			if (currentSlug === slug) collapsePost();
			else openPost(slug);
		}
		async function openPost(slug) {
			const post = POSTS.find(function(p) { return p.slug === slug; });
			if (!post) return;
			if (currentSlug && currentSlug !== slug) collapsePost(true);
			currentSlug = slug;
			markRead(slug);
			const li = rowFor(slug);
			if (!li) return;
			li.classList.remove('unread'); li.classList.add('read');
			const summary = li.querySelector('.row-summary');
			const expanded = li.querySelector('.row-expanded');
			summary.style.display = 'none';
			expanded.innerHTML = expandedHtml(post);
			expanded.style.display = 'block';
			const body = expanded.querySelector('.exp-body');
			if (post.embed === 'substack') {
				const embed = document.querySelector('#substack-embed-source .substack-post-embed');
				if (embed) body.appendChild(embed);
			} else {
				body.innerHTML = '<p>loading&hellip;</p>';
				try {
					const response = await fetch('posts/' + slug + '.md');
					const markdown = await response.text();
					if (currentSlug === slug) body.innerHTML = markdownToHtml(markdown);
				} catch (error) {
					console.error('Error loading post:', error);
					if (currentSlug === slug) body.innerHTML = '<p>Failed to load post.</p>';
				}
			}
			history.replaceState(null, '', '#' + slug);
			li.scrollIntoView({ block: 'nearest' });
		}
		function collapsePost(silent) {
			if (!currentSlug) return;
			const slug = currentSlug;
			currentSlug = null;
			clearExpandedBody();
			const li = rowFor(slug);
			if (li) {
				li.querySelector('.row-summary').style.display = '';
				const expanded = li.querySelector('.row-expanded');
				expanded.style.display = 'none';
				expanded.innerHTML = '';
			}
			if (!silent) history.replaceState(null, '', window.location.pathname + window.location.search);
		}
		function navPost(dir) {
			if (!currentSlug) return;
			const idx = POSTS.findIndex(function(p) { return p.slug === currentSlug; });
			const next = POSTS[idx + dir];
			if (next) openPost(next.slug);
		}
		function toggleDetails(slug) {
			const details = document.getElementById('exp-details-' + slug);
			if (!details) return;
			const isOpen = details.style.display === 'block';
			details.style.display = isOpen ? 'none' : 'block';
			const li = rowFor(slug);
			const btn = li ? li.querySelector('.email-to-line button') : null;
			if (btn) btn.innerHTML = isOpen ? 'to me &#9662;' : 'to me &#9652;';
		}
		function sendReply(slug) {
			const post = POSTS.find(function(p) { return p.slug === slug; });
			if (!post) return;
			const textEl = document.getElementById('exp-reply-' + slug);
			const text = textEl ? textEl.value : '';
			const url = 'mailto:savan@duck.com?subject=' + encodeURIComponent('Re: ' + post.title) + (text ? '&body=' + encodeURIComponent(text) : '');
			window.location.href = url;
		}
		// Deep links: #slug expands that post inline and scrolls to it.
		function openFromHash() {
			const hash = window.location.hash.replace(/^#/, '');
			if (!hash) { if (currentSlug) collapsePost(); return; }
			const postId = hash.replace(/^post-/, '');
			if (POSTS.some(function(p) { return p.slug === postId; })) {
				if (currentSlug !== postId) openPost(postId);
			}
		}
		document.addEventListener('keydown', function(e) {
			if (e.key === 'Escape' && currentSlug) collapsePost();
		});
		window.addEventListener('DOMContentLoaded', function() {
			renderRows();
			openFromHash();
		});
		window.addEventListener('hashchange', openFromHash);
	</script>
